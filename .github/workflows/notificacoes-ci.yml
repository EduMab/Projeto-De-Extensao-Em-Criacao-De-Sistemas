name: Build e testes Java

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/notificacoes-semanais"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Validar JavaScript e manifesto PWA
        run: |
          node --check src/main/resources/static/painel.js
          node --check src/main/resources/static/simulados.js
          node --check src/main/resources/static/sw.js
          python -m json.tool src/main/resources/static/manifest.webmanifest > /dev/null
      - name: Executar testes e empacotar
        run: mvn --batch-mode --no-transfer-progress clean verify

name: Publicar revisão aprovada dos concursos
on:
  pull_request:
    paths: ['scripts/*revisao_concursos*', 'scripts/*recortes_concursos*', 'scripts/*previa_concursos*', 'acervo/concursos-previa-enem/**', '.github/workflows/revisar-recortes-concursos.yml']
  push:
    branches: [main]
    paths: ['scripts/*revisao_concursos*', 'scripts/*recortes_concursos*', 'scripts/*previa_concursos*', 'acervo/concursos-previa-enem/**', '.github/workflows/revisar-recortes-concursos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revisao-concursos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: teste-local
          MYSQL_DATABASE: evolua_revisao_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pteste-local"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-enem.txt reportlab==4.4.5
      - run: python scripts/preparar_previa_concursos_enem.py
      - run: python scripts/empacotar_revisao_concursos.py
      - run: python scripts/atualizar_recortes_concursos.py
      - run: python scripts/gerar_previa_concursos_enem.py
      - run: node scripts/test_previa_concursos_enem.cjs
      - name: Testar atualização, reversão, falha SQL, IDs e snapshots
        run: python -m unittest discover -s scripts -p test_atualizar_recortes_concursos.py -v
        env:
          RUN_MYSQL_TESTS: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: evolua_revisao_test
          DB_SENHA: teste-local
  aplicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: concursos
    concurrency:
      group: concursos-banco-compartilhado
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-enem.txt
      - run: python scripts/preparar_previa_concursos_enem.py
      - run: python scripts/empacotar_revisao_concursos.py
      - name: Conferir imagens públicas e atualizar catálogo aprovado
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USUARIO: ${{ secrets.DB_USUARIO }}
          DB_SENHA: ${{ secrets.DB_SENHA }}
          DB_SSL_MODE: ${{ vars.DB_SSL_MODE || 'REQUIRED' }}
          DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
        run: |
          if [ -n "$DB_SSL_CA" ]; then
            ca_file="$RUNNER_TEMP/concursos-revisao-ca.pem"
            umask 077
            printf '%s\n' "$DB_SSL_CA" > "$ca_file"
            export DB_SSL_CA="$ca_file"
          fi
          python scripts/atualizar_recortes_concursos.py --aplicar

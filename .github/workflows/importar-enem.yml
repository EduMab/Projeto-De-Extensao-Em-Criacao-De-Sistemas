name: Validar e publicar ENEM amarelo

on:
  pull_request:
    paths: ['acervo/enem/**', 'scripts/*enem*', 'src/**', 'pom.xml', 'Dockerfile', '.github/workflows/importar-enem.yml']
  push:
    branches: [main]
    paths: ['acervo/enem/**', 'scripts/*enem*', 'pom.xml', 'Dockerfile', '.github/workflows/importar-enem.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enem-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: teste-local
          MYSQL_DATABASE: evolua_enem_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pteste-local"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-enem.txt
      - run: python scripts/preparar_enem_amarelo.py --baixar --somente-validar
      - run: python scripts/renderizar_enem_amarelo.py
      - run: python scripts/importar_enem.py
      - run: python -m unittest discover -s scripts -p 'test_enem_amarelo.py' -v
      - run: python -m unittest discover -s scripts -p 'test_importar_enem.py' -v
        env:
          RUN_MYSQL_TESTS: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: evolua_enem_test
          DB_USUARIO: root
          DB_SENHA: teste-local
      - run: node scripts/test_enem_site.cjs
      - name: Preparar recursos FUVEST existentes
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python scripts/preparar_fuvest.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp clean package
      - run: node scripts/test_simulados_recortes.cjs

  importar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: enem
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-enem.txt
      - run: python scripts/preparar_enem_amarelo.py --baixar --somente-validar
      - run: python scripts/renderizar_enem_amarelo.py
      - name: Publicação e carga ENEM aprovadas
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USUARIO: ${{ secrets.DB_USUARIO }}
          DB_SENHA: ${{ secrets.DB_SENHA }}
          DB_SSL_MODE: ${{ vars.DB_SSL_MODE || 'REQUIRED' }}
          DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
        run: |
          if [ -n "$DB_SSL_CA" ]; then
            ca_file="$RUNNER_TEMP/enem-ca.pem"
            umask 077
            printf '%s\n' "$DB_SSL_CA" > "$ca_file"
            export DB_SSL_CA="$ca_file"
          fi
          python scripts/importar_enem.py --aplicar --esperar-publicacao 180

name: Publicar acervo FUVEST

on:
  pull_request:
    paths:
      - 'acervo/fuvest/**'
      - 'scripts/*fuvest*'
      - 'scripts/importar_concursos.py'
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/importar-fuvest.yml'
  push:
    branches: [main]
    paths:
      - 'acervo/fuvest/**'
      - 'scripts/*fuvest*'
      - 'src/main/resources/static/questoes/fuvest/**'
      - '.github/workflows/importar-fuvest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuvest-publicacao
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: teste-local
          MYSQL_DATABASE: evolua_fuvest_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pteste-local"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Poppler e bibliotecas de importação
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -r scripts/requirements-concursos.txt
      - run: python scripts/preparar_fuvest.py
      - name: Conferir recortes individuais, alternativas e apoios
        run: python -m unittest discover -s scripts -p test_recortes_fuvest.py -v
      - run: python scripts/importar_fuvest.py
      - name: Testar importação, repetição e conflitos
        run: python -m unittest discover -s scripts -p test_importar_fuvest.py -v
        env:
          RUN_MYSQL_TESTS: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: evolua_fuvest_test
          DB_USUARIO: root
          DB_SENHA: teste-local
          DB_SSL_MODE: DISABLED
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp clean package
      - run: node scripts/test_simulados_recortes.cjs

  importar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: fuvest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Poppler e bibliotecas de importação
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -r scripts/requirements-concursos.txt
      - run: python scripts/preparar_fuvest.py
      - name: Simular e aplicar no banco compartilhado
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USUARIO: ${{ secrets.DB_USUARIO }}
          DB_SENHA: ${{ secrets.DB_SENHA }}
          DB_SSL_MODE: ${{ vars.DB_SSL_MODE || 'REQUIRED' }}
          DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
        run: |
          if [ -n "$DB_SSL_CA" ]; then
            ca_file="$RUNNER_TEMP/fuvest-ca.pem"
            umask 077
            printf '%s\n' "$DB_SSL_CA" > "$ca_file"
            export DB_SSL_CA="$ca_file"
          fi
          python scripts/importar_fuvest.py --simular
          python scripts/importar_fuvest.py --aplicar
      - name: Solicitar publicação no Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            python - <<'PY'
          import os
          import urllib.request
          try:
              request = urllib.request.Request(os.environ["RENDER_DEPLOY_HOOK"], method="POST")
              with urllib.request.urlopen(request, timeout=60) as response:
                  if response.status not in (200, 201, 202):
                      raise RuntimeError()
          except Exception:
              raise SystemExit("Falha ao solicitar publicação no Render. Confira o deploy hook.")
          print("Publicação solicitada. Acompanhe a conclusão no Render.")
          PY
          else
            echo "Carga concluída. A publicação segue a configuração de deploy automático do Render."
          fi

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evolua+ | Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f7;
            color: #222;
        }

        .topo {
            width: 100%;
            background: #6f4bc3;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        .topo h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .topo p {
            font-size: 16px;
            opacity: 0.95;
        }

        .pagina {
            min-height: calc(100vh - 130px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .cadastro-container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 38px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
        }

        .cadastro-container h2 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #6f4bc3;
            box-shadow: 0 0 0 3px rgba(111, 75, 195, 0.12);
        }

        .dica-senha {
            display: block;
            margin-top: 6px;
            color: #777;
            font-size: 12px;
        }

        .botao-cadastrar {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            background: #6f4bc3;
            color: white;
            transition: 0.2s;
        }

        .botao-cadastrar:hover {
            background: #5e3db0;
        }

        .botao-cadastrar:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #mensagem {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1px solid #eee;
            color: #555;
            font-size: 14px;
        }

        .login a {
            color: #6f4bc3;
            font-weight: bold;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        .rodape {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 500px) {

            .topo {
                padding: 28px 15px;
            }

            .topo h1 {
                font-size: 30px;
            }

            .pagina {
                padding: 25px 15px;
                align-items: flex-start;
            }

            .cadastro-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<header class="topo">

    <h1>Evolua+</h1>

    <p>
        Seu desempenho, seus estudos, sua evolução.
    </p>

</header>


<main class="pagina">

    <div class="cadastro-container">

        <h2>Crie sua conta</h2>

        <p class="subtitulo">
            Comece agora sua preparação para as provas.
        </p>


        <form id="formCadastro">

            <label for="nome">
                Nome
            </label>

            <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required
            >


            <label for="email">
                E-mail
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
            >


            <label for="senha">
                Senha
            </label>

            <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    autocomplete="new-password"
                    required
            >

            <small class="dica-senha">
                Utilize pelo menos 6 caracteres.
            </small>


            <button
                    type="submit"
                    id="btnCadastrar"
                    class="botao-cadastrar"
            >
                Criar conta
            </button>

        </form>


        <p id="mensagem"></p>


        <div class="login">

            Já possui uma conta?

            <a href="/login.html">
                Entrar
            </a>

        </div>


        <div class="rodape">
            Evolua+ • Plataforma de preparação para provas
        </div>

    </div>

</main>


<script>

    document
        .getElementById("formCadastro")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const nome =
                document.getElementById("nome")
                    .value.trim();

            const email =
                document.getElementById("email")
                    .value.trim();

            const senha =
                document.getElementById("senha")
                    .value;

            const mensagem =
                document.getElementById("mensagem");

            const btnCadastrar =
                document.getElementById("btnCadastrar");


            mensagem.innerText = "";

            btnCadastrar.disabled = true;

            btnCadastrar.innerText =
                "Criando conta...";


            const parametros =
                new URLSearchParams();

            parametros.append(
                "nome",
                nome
            );

            parametros.append(
                "email",
                email
            );

            parametros.append(
                "senha",
                senha
            );


            fetch("/cadastro", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/x-www-form-urlencoded"

                },

                body: parametros

            })

                .then(response =>
                    response.json()
                )

                .then(data => {

                    if (data.sucesso) {

                        mensagem.style.color =
                            "#198754";

                        mensagem.innerText =
                            "Cadastro realizado com sucesso! Redirecionando para o login...";


                        setTimeout(function() {

                            window.location.href =
                                "/login.html";

                        }, 1500);

                    } else {

                        mensagem.style.color =
                            "#d32f2f";

                        mensagem.innerText =
                            data.mensagem ||
                            "Não foi possível realizar o cadastro.";

                        btnCadastrar.disabled =
                            false;

                        btnCadastrar.innerText =
                            "Criar conta";
                    }

                })

                .catch(error => {

                    console.error(error);

                    mensagem.style.color =
                        "#d32f2f";

                    mensagem.innerText =
                        "Erro ao realizar cadastro.";

                    btnCadastrar.disabled =
                        false;

                    btnCadastrar.innerText =
                        "Criar conta";

                });

        });

</script>

</body>

</html>

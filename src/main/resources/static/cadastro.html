<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Evolua+ | Entrar e criar conta</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="/acesso.css?v=20261124" rel="stylesheet"/>
</head>
<body>
<!-- ícones (estilo Lucide) -->
<svg aria-hidden="true" focusable="false" height="0" style="position:absolute" width="0">
<defs>
<symbol id="i-mail" viewbox="0 0 24 24"><rect height="16" rx="2" width="20" x="2" y="4"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></symbol>
<symbol id="i-lock" viewbox="0 0 24 24"><rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></symbol>
<symbol id="i-user" viewbox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></symbol>
<symbol id="i-eye" viewbox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></symbol>
<symbol id="i-eye-off" viewbox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" x2="22" y1="2" y2="22"></line></symbol>
<symbol id="i-arrow" viewbox="0 0 24 24"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></symbol>
</defs>
</svg>
<div aria-hidden="true" class="wall">
<svg preserveaspectratio="xMidYMid slice" viewbox="0 0 1440 900">
<defs>
<lineargradient id="gGold" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#3b1a78" stop-opacity="0"></stop>
<stop offset=".3" stop-color="#8b3df5"></stop>
<stop offset=".62" stop-color="#d9b8ff"></stop>
<stop offset="1" stop-color="#5b21b6" stop-opacity="0"></stop>
</lineargradient>
<lineargradient id="gSteel" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#0f0a1a"></stop>
<stop offset=".4" stop-color="#5a4a85"></stop>
<stop offset=".7" stop-color="#1c1430"></stop>
<stop offset="1" stop-color="#08050f"></stop>
</lineargradient>
<filter height="200%" id="soft" width="140%" x="-20%" y="-50%"><fegaussianblur stddeviation="16"></fegaussianblur></filter>
<filter height="200%" id="soft2" width="140%" x="-20%" y="-50%"><fegaussianblur stddeviation="2.5"></fegaussianblur></filter>
</defs>
<rect fill="#07050d" height="900" width="1440"></rect>
<g class="drift">
<path d="M-160 230 C 240 40, 560 560, 960 400 S 1500 120, 1700 250" fill="none" opacity=".95" stroke="url(#gSteel)" stroke-width="170"></path>
<path d="M-160 190 C 240 0, 560 520, 960 360 S 1500 80, 1700 210" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="3"></path>
<path d="M-200 880 C 200 640, 640 1000, 1000 760 S 1500 520, 1700 640" fill="none" opacity=".9" stroke="url(#gSteel)" stroke-width="140"></path>
<path d="M700 -60 C 900 140, 1200 120, 1520 -20" fill="none" filter="url(#soft)" opacity=".5" stroke="url(#gGold)" stroke-width="40"></path>
<path d="M-180 640 C 160 360, 520 860, 900 560 S 1380 260, 1700 420" fill="none" filter="url(#soft)" opacity=".6" stroke="url(#gGold)" stroke-width="120"></path>
<path d="M-180 640 C 160 360, 520 860, 900 560 S 1380 260, 1700 420" fill="none" filter="url(#soft2)" opacity=".95" stroke="url(#gGold)" stroke-width="30"></path>
<path d="M-180 640 C 160 360, 520 860, 900 560 S 1380 260, 1700 420" fill="none" opacity=".9" stroke="#f1e4ff" stroke-width="2"></path>
<path d="M-180 640 C 160 360, 520 860, 900 560 S 1380 260, 1700 420" fill="none" opacity=".5" stroke="#b58cff" stroke-width="1.5" transform="translate(0 20)"></path>
<path d="M-180 640 C 160 360, 520 860, 900 560 S 1380 260, 1700 420" fill="none" opacity=".4" stroke="#b58cff" stroke-width="1.5" transform="translate(0 -24)"></path>
</g>
</svg>
</div>
<main class="stage">
<svg aria-hidden="true" class="shard tl" viewbox="0 0 56 56"><path d="M4 4H38L4 38Z"></path></svg>
<svg aria-hidden="true" class="shard br" viewbox="0 0 56 56"><path d="M4 4H38L4 38Z"></path></svg>
<section aria-label="Acesso à conta" class="card" data-mode="signup" data-phase="idle" id="card">
<div class="forms">
<!-- ===== LOGIN ===== -->
<form aria-hidden="true" aria-labelledby="loginTitle" class="form" data-loading="Entrando…" id="loginForm" inert="" novalidate="">
<header class="head reveal" style="--i:0"><p class="brand">Evolua+</p>
<h1 id="loginTitle" tabindex="-1">Bem-vindo <em>de volta</em></h1>
<p class="sub">Seus estudos, seu desempenho, sua evolução. Continue sua preparação.</p>
</header>
<div class="field reveal" style="--i:1">
<label for="loginEmail">Endereço de e-mail</label>
<div class="control">
<input aria-describedby="loginEmail-err" autocomplete="email" id="loginEmail" inputmode="email" name="email" placeholder="nome@dominio.com" required="" type="email"/>
<svg aria-hidden="true" class="i ico"><use href="#i-mail"></use></svg>
</div>
<p aria-live="polite" class="err" id="loginEmail-err"></p>
</div>
<div class="field reveal" style="--i:2">
<label for="loginPassword">Senha</label>
<div class="control">
<input aria-describedby="loginPassword-err" autocomplete="current-password" id="loginPassword" name="password" placeholder="••••••••••••" required="" type="password"/>
<svg aria-hidden="true" class="i ico"><use href="#i-lock"></use></svg>
<button aria-label="Mostrar senha" aria-pressed="false" class="eye" data-reveal="loginPassword" type="button">
<svg aria-hidden="true" class="i show"><use href="#i-eye"></use></svg>
<svg aria-hidden="true" class="i hide"><use href="#i-eye-off"></use></svg>
</button>
</div>
<p aria-live="polite" class="err" id="loginPassword-err"></p>
</div>

<button class="btn btn-primary reveal" style="--i:4" type="submit">
<span class="label">Entrar</span>
<svg aria-hidden="true" class="i arrow" height="18" width="18"><use href="#i-arrow"></use></svg>
<span aria-hidden="true" class="spin"></span>
</button>
<p class="status" role="status"></p>


<p class="foot reveal" style="--i:7">Não tem uma conta? <button class="link strong" data-go="signup" type="button">Cadastre-se</button></p>
</form>
<!-- ===== CADASTRO ===== -->
<form aria-hidden="false" aria-labelledby="signupTitle" class="form" data-loading="Criando conta…" id="signupForm" novalidate="">
<header class="head reveal" style="--i:0"><p class="brand">Evolua+</p>
<h1 id="signupTitle" tabindex="-1">Criar <em>conta</em></h1>
<p class="sub">Prepare-se para ETEC, ENEM, FUVEST e concursos. Escolha seu objetivo após o cadastro.</p>
</header>
<div class="field reveal" style="--i:1">
<label for="signupName">Nome completo</label>
<div class="control">
<input aria-describedby="signupName-err" autocomplete="name" id="signupName" name="name" placeholder="Maria Souza" required="" type="text"/>
<svg aria-hidden="true" class="i ico"><use href="#i-user"></use></svg>
</div>
<p aria-live="polite" class="err" id="signupName-err"></p>
</div>
<div class="field reveal" style="--i:2">
<label for="signupEmail">Endereço de e-mail</label>
<div class="control">
<input aria-describedby="signupEmail-err" autocomplete="email" id="signupEmail" inputmode="email" name="email" placeholder="nome@dominio.com" required="" type="email"/>
<svg aria-hidden="true" class="i ico"><use href="#i-mail"></use></svg>
</div>
<p aria-live="polite" class="err" id="signupEmail-err"></p>
</div>
<div class="pair reveal" style="--i:3">
<div class="field">
<label for="signupPassword">Senha</label>
<div class="control">
<input aria-describedby="signupPassword-err" autocomplete="new-password" id="signupPassword" minlength="6" name="password" placeholder="••••••••" required="" type="password"/>
<svg aria-hidden="true" class="i ico"><use href="#i-lock"></use></svg>
<button aria-label="Mostrar senha" aria-pressed="false" class="eye" data-reveal="signupPassword" type="button">
<svg aria-hidden="true" class="i show"><use href="#i-eye"></use></svg>
<svg aria-hidden="true" class="i hide"><use href="#i-eye-off"></use></svg>
</button>
</div>
<p aria-live="polite" class="err" id="signupPassword-err"></p>
</div>
<div class="field">
<label for="signupConfirm">Confirmar senha</label>
<div class="control">
<input aria-describedby="signupConfirm-err" autocomplete="new-password" id="signupConfirm" minlength="6" name="confirm" placeholder="••••••••" required="" type="password"/>
<svg aria-hidden="true" class="i ico"><use href="#i-lock"></use></svg>
<button aria-label="Mostrar senha" aria-pressed="false" class="eye" data-reveal="signupConfirm" type="button">
<svg aria-hidden="true" class="i show"><use href="#i-eye"></use></svg>
<svg aria-hidden="true" class="i hide"><use href="#i-eye-off"></use></svg>
</button>
</div>
<p aria-live="polite" class="err" id="signupConfirm-err"></p>
</div>
</div>

<button class="btn btn-primary reveal" style="--i:5" type="submit">
<span class="label">Criar conta</span>
<svg aria-hidden="true" class="i arrow" height="18" width="18"><use href="#i-arrow"></use></svg>
<span aria-hidden="true" class="spin"></span>
</button>
<p class="status" role="status"></p>

<p class="foot reveal" style="--i:7">Já tem uma conta? <button class="link strong" data-go="login" type="button">Entrar</button></p>
</form>
</div>
<!-- painéis da transição -->
<div class="panel a"></div>
<div class="panel b"></div>
<svg aria-hidden="true" class="seam" preserveaspectratio="none" viewbox="0 0 100 100">
<defs>
<lineargradient id="seamG" x1="1" x2="0" y1="0" y2="1">
<stop offset="0" stop-color="#b58cff" stop-opacity="0"></stop>
<stop offset=".5" stop-color="#e9dcff"></stop>
<stop offset="1" stop-color="#b58cff" stop-opacity="0"></stop>
</lineargradient>
</defs>
<line stroke="url(#seamG)" stroke-width="1.5" vector-effect="non-scaling-stroke" x1="100" x2="0" y1="0" y2="100"></line>
</svg>
<svg aria-hidden="true" class="logo" viewbox="-8 -8 78 78">
<g class="half h1"><polygon class="ring" points="0,0 52,0 0,52"></polygon><polygon class="core" points="0,0 52,0 0,52"></polygon></g>
<g class="half h2"><polygon class="ring" points="62,8 62,62 8,62"></polygon><polygon class="core" points="62,8 62,62 8,62"></polygon></g>
</svg>
<i class="edge tl"></i>
<i class="edge br"></i>
</section>
</main>
<script src="/acesso.js?v=20261124"></script>
</body>
</html>

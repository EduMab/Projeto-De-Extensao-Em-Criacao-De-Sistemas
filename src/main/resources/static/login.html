<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evolua+ | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f7;
            color: #222;
        }

        .topo {
            width: 100%;
            background: #6f4bc3;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        .topo h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .topo p {
            font-size: 16px;
            opacity: 0.95;
        }

        .pagina {
            min-height: calc(100vh - 130px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 38px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
        }

        .login-container h2 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #6f4bc3;
            box-shadow: 0 0 0 3px rgba(111, 75, 195, 0.12);
        }

        .botao-entrar {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            background: #6f4bc3;
            color: white;
            transition: 0.2s;
        }

        .botao-entrar:hover {
            background: #5e3db0;
        }

        .botao-entrar:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #mensagem {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            color: #d32f2f;
            font-size: 14px;
        }

        .cadastro {
            text-align: center;
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1px solid #eee;
            color: #555;
            font-size: 14px;
        }

        .cadastro a {
            color: #6f4bc3;
            font-weight: bold;
            text-decoration: none;
        }

        .cadastro a:hover {
            text-decoration: underline;
        }

        .rodape {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 500px) {

            .topo {
                padding: 28px 15px;
            }

            .topo h1 {
                font-size: 30px;
            }

            .pagina {
                padding: 25px 15px;
                align-items: flex-start;
            }

            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<header class="topo">
    <h1>Evolua+</h1>
    <p>Seu desempenho, seus estudos, sua evolução.</p>
</header>

<main class="pagina">

    <div class="login-container">

        <h2>Bem-vindo!</h2>

        <p class="subtitulo">
            Entre na sua conta para continuar seus estudos.
        </p>

        <form id="formLogin">

            <label for="email">
                E-mail
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
            >

            <label for="senha">
                Senha
            </label>

            <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
            >

            <button
                    type="submit"
                    id="btnEntrar"
                    class="botao-entrar"
            >
                Entrar
            </button>

        </form>

        <p id="mensagem"></p>

        <div class="cadastro">
            Ainda não possui uma conta?
            <a href="/cadastro.html">
                Criar conta
            </a>
        </div>

        <div class="rodape">
            Evolua+ • Plataforma de preparação para provas
        </div>

    </div>

</main>


<script>

    document
        .getElementById("formLogin")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const senha =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem");

            const btnEntrar =
                document.getElementById("btnEntrar");


            mensagem.innerText = "";

            btnEntrar.disabled = true;
            btnEntrar.innerText = "Entrando...";


            const parametros =
                new URLSearchParams();

            parametros.append("email", email);
            parametros.append("senha", senha);


            fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: parametros

            })

                .then(response => response.json())

                .then(data => {

                    if (data.sucesso) {

                        localStorage.setItem(
                            "idEstudante",
                            data.idEstudante
                        );

                        localStorage.setItem(
                            "nomeEstudante",
                            data.nome
                        );

                        window.location.href =
                            "/index.html";

                    } else {

                        mensagem.innerText =
                            data.mensagem ||
                            "E-mail ou senha inválidos.";

                        btnEntrar.disabled = false;
                        btnEntrar.innerText = "Entrar";
                    }

                })

                .catch(error => {

                    console.error(error);

                    mensagem.innerText =
                        "Erro ao realizar login.";

                    btnEntrar.disabled = false;
                    btnEntrar.innerText = "Entrar";
                });

        });

</script>

</body>

</html>
